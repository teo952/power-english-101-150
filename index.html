<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Power English">
<meta name="theme-color" content="#eef0f4">
<title>Power English 101–150</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap">
<style>
/* Layout: one study column (max 880px) — header with voice controls, tab bar, range chips, then the active mode */
:root{
  --bg:#eef0f4; --surface:#ffffff; --ink:#1a2140; --muted:#5b6380; --line:#d6dae5;
  --accent:#2846c9; --accent-ink:#ffffff; --accent-soft:#e3e8fb;
  --hl:#ffd93b; --hl-soft:#fff0a0; --hl-ink:#1a2140;
  --good:#17804f; --good-soft:#dcf2e6; --bad:#c23b2a; --bad-soft:#fbe3df;
  --shadow:0 1px 2px rgba(20,30,70,.06),0 8px 24px rgba(20,30,70,.07);
  --f-display:"Newsreader","Times New Roman",Georgia,serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141d; --surface:#1a1f2d; --ink:#e7e9f1; --muted:#9aa2bb; --line:#2c3346;
    --accent:#8ea3ff; --accent-ink:#0f1430; --accent-soft:#252d4d;
    --hl:#e3c23a; --hl-soft:rgba(240,200,40,.24); --hl-ink:#151a2e;
    --good:#4fc68b; --good-soft:rgba(79,198,139,.15); --bad:#ff7a66; --bad-soft:rgba(255,122,102,.15);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11141d; --surface:#1a1f2d; --ink:#e7e9f1; --muted:#9aa2bb; --line:#2c3346;
  --accent:#8ea3ff; --accent-ink:#0f1430; --accent-soft:#252d4d;
  --hl:#e3c23a; --hl-soft:rgba(240,200,40,.24); --hl-ink:#151a2e;
  --good:#4fc68b; --good-soft:rgba(79,198,139,.15); --bad:#ff7a66; --bad-soft:rgba(255,122,102,.15);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-inline:16px;padding-block:20px 56px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.app{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
mark{background:linear-gradient(transparent 55%,var(--hl-soft) 55%);color:inherit;font-weight:600;padding:0 1px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.eyebrow{margin:0 0 2px;font-size:.78rem;letter-spacing:.06em;color:var(--muted)}
h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(1.9rem,5vw,2.6rem);line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
h1 span{font-family:var(--f-mono);font-weight:500;font-size:.55em;letter-spacing:0;color:var(--accent);vertical-align:.35em;margin-left:.2em}
.voicebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:.85rem;color:var(--muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.vsel{min-height:42px;max-width:220px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);padding:0 12px;font:inherit;font-size:.85rem}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:0 12px;min-height:42px}
.chk[aria-pressed="true"]{color:var(--ink);border-color:var(--accent)}
.chk .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--muted)}
.chk[aria-pressed="true"] .dot{background:var(--accent);border-color:var(--accent)}

.top .brand{flex:1;min-width:0}
.voicebar{flex-basis:100%}
#view{scroll-margin-top:72px}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:var(--shadow)}
.tabs button{border:0;background:none;border-radius:10px;padding:10px 4px;font-weight:500;color:var(--muted);min-height:46px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tabs small{font-family:var(--f-mono);font-size:.72rem;opacity:.75;margin-left:4px}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;min-height:38px;color:var(--ink)}
.chip b{font-family:var(--f-mono);font-weight:500;font-size:.78rem;color:var(--muted);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"] b{color:var(--accent)}
.chip.starchip[aria-pressed="true"]{background:var(--hl);border-color:var(--hl);color:var(--hl-ink)}
.chip.starchip[aria-pressed="true"] b{color:var(--hl-ink)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;min-height:46px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn svg{width:20px;height:20px;flex:none}
.say{border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:50%;width:40px;height:40px;display:inline-grid;place-items:center;flex:none;vertical-align:middle;padding:0}
.say svg{width:20px;height:20px}
.say:active,.btn:active{transform:scale(.97)}
.ipa{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.pos{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
.badge{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;background:var(--hl);color:var(--hl-ink);border-radius:6px;padding:2px 7px;white-space:nowrap}
.tip{margin:0;font-size:.85rem;color:var(--muted);padding-left:10px;border-left:2px solid var(--hl)}
.ko{margin:0;color:var(--muted);font-size:.92rem}

/* list */
.listhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.listhead p{margin:0;color:var(--muted);font-size:.9rem}
.unit{padding:14px 18px 10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.unit h3{margin:0;font-family:var(--f-display);font-size:1.25rem;font-weight:600}
.unit q{font-family:var(--f-display);font-style:italic;color:var(--muted);font-size:.95rem;quotes:none}
.row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:6px 12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.r-no{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);padding-top:8px;font-variant-numeric:tabular-nums}
.r-main{min-width:0;display:flex;flex-direction:column;gap:6px}
.r-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.wordbtn{border:0;background:none;padding:0;font-family:var(--f-display);font-weight:600;font-size:1.6rem;line-height:1.2;color:var(--ink);text-align:left}
.r-mean{font-weight:500}
.r-sent{display:flex;gap:8px;align-items:flex-start}
.r-sent .en{margin:0;font-family:var(--f-display);font-size:1.08rem;line-height:1.45;flex:1;min-width:0}
.cover .r-mean,.cover .ko{background:var(--line);color:transparent;border-radius:6px;user-select:none;cursor:pointer}
.cover .r-mean *,.cover .ko *{visibility:hidden}
.kbtn{align-self:start;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:.8rem;color:var(--muted);min-height:38px;white-space:nowrap}
.kbtn[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}

/* cards */
.cardmeta{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.88rem;color:var(--muted);flex-wrap:wrap}
.cardmeta .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex:1;min-width:120px}
.bar i{display:block;height:100%;background:var(--good);border-radius:3px;transition:width .3s}
.card{padding:22px 22px 18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.card.isstar{border-top:6px solid var(--hl)}
.c-top{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.c-top .c-no{font-family:var(--f-mono)}
.c-word{margin:6px 0 0;font-family:var(--f-display);font-weight:600;font-size:clamp(3rem,11vw,5.4rem);line-height:1;letter-spacing:-.015em;overflow-wrap:anywhere}
.c-mean-front{margin:10px 0 0;font-weight:700;font-size:clamp(1.4rem,4.5vw,2rem);line-height:1.35;text-wrap:balance}
.c-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.c-line .ipa{font-size:1rem}
.c-say{display:flex;gap:8px;flex-wrap:wrap}
.c-back{border:2px dashed var(--line);border-radius:12px;min-height:150px;display:flex;flex-direction:column;gap:10px;padding:16px;cursor:pointer}
.c-back.open{border-style:solid;border-color:var(--accent-soft);background:var(--accent-soft);cursor:default}
.c-hint{margin:auto;color:var(--muted);text-align:center}
.c-mean{margin:0;font-weight:700;font-size:1.25rem;line-height:1.4}
.c-ans{margin:0;font-family:var(--f-display);font-weight:600;font-size:2rem;line-height:1.1}
.c-sent{display:flex;gap:8px;align-items:flex-start}
.c-sent p{margin:0;font-family:var(--f-display);font-size:1.2rem;line-height:1.45;flex:1;min-width:0}
.c-nav{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px}
.c-tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* quiz */
.qsetup{padding:20px;display:flex;flex-direction:column;gap:18px}
.qsetup h2,.qend h2{margin:0;font-family:var(--f-display);font-size:1.5rem;font-weight:600}
.qsetup .label{margin:0 0 8px;font-size:.82rem;color:var(--muted);letter-spacing:.04em}
.qtypes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.qtype{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:76px}
.qtype b{font-weight:700}
.qtype span{font-size:.8rem;color:var(--muted);line-height:1.35}
.qtype[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.qtype[aria-pressed="true"] b{color:var(--accent)}
.qhead{display:flex;align-items:center;gap:12px;font-size:.88rem;color:var(--muted)}
.qhead .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.qbox{padding:22px;display:flex;flex-direction:column;gap:16px}
.qkind{margin:0;font-size:.8rem;letter-spacing:.05em;color:var(--muted)}
.qprompt{display:flex;flex-direction:column;gap:8px}
.q-word{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(2.6rem,9vw,4rem);line-height:1}
.q-mean{margin:0;font-weight:700;font-size:clamp(1.25rem,4vw,1.7rem);line-height:1.4}
.q-sent{margin:0;font-family:var(--f-display);font-size:clamp(1.25rem,3.6vw,1.55rem);line-height:1.5}
.q-blank{display:inline-block;min-width:5.5em;border-bottom:2px solid var(--ink);text-align:center;font-weight:600}
.q-listen{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.q-listen .btn.primary{min-height:64px;padding:0 26px;font-size:1.05rem}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 14px 14px 44px;text-align:left;min-height:64px;position:relative;line-height:1.4}
.opt::before{content:attr(data-k);position:absolute;left:14px;top:14px;font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.opt.en{font-family:var(--f-display);font-size:1.35rem;font-weight:600}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt:disabled{cursor:default}
.typeform{display:flex;gap:8px;flex-wrap:wrap}
.typeform input{flex:1;min-width:0;min-height:54px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0 14px;font-family:var(--f-display);font-size:1.5rem}
.typeform input.right{border-color:var(--good)}
.typeform input.wrong{border-color:var(--bad)}
.fb{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--good-soft)}
.fb.no{background:var(--bad-soft)}
.fb .verdict{margin:0;font-weight:700}
.fb.ok .verdict{color:var(--good)}
.fb.no .verdict{color:var(--bad)}
.fb .ansline{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.fb .ansline strong{font-family:var(--f-display);font-size:1.5rem}
.fb .yours{margin:0;font-size:.9rem;color:var(--bad)}
.qactions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.qend{padding:24px 20px;display:flex;flex-direction:column;gap:16px}
.score{font-family:var(--f-display);font-weight:600;font-size:clamp(3rem,10vw,4.5rem);line-height:1;margin:0}
.score small{font-size:.4em;color:var(--muted);font-family:var(--f-body);font-weight:500;margin-left:8px}
.mini{display:flex;flex-direction:column}
.mini-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mini-row .w{font-family:var(--f-display);font-weight:600;font-size:1.25rem}
.mini-row .m{font-size:.9rem;color:var(--muted);min-width:0}
.mini-row .cnt{font-family:var(--f-mono);font-size:.8rem;color:var(--bad)}
.wrongs{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.wrongs h2{margin:0;font-family:var(--f-display);font-size:1.4rem;font-weight:600}
.wrongs p{margin:0;color:var(--muted);font-size:.92rem}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.xbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 10px;font-size:.8rem;color:var(--muted);min-height:36px}
/* bottom dock: next/answer buttons stay on screen */
.dock{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:8px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 -6px 20px rgba(20,30,70,.14)}
.dock .btn{flex:1;min-height:50px}
.dock .btn.icon{flex:0 0 54px;padding:0}
.rangebtn{font-weight:500}

/* sentence study */
.s-ko{margin:0;font-weight:700;font-size:clamp(1.15rem,4.2vw,1.45rem);line-height:1.5;text-wrap:pretty}
.s-en{margin:0;font-family:var(--f-display);font-size:clamp(1.25rem,4.4vw,1.55rem);line-height:1.5;flex:1;min-width:0}
.s-key{font-size:.85rem;color:var(--muted)}
.s-key b{font-family:var(--f-display);font-size:1.1rem;color:var(--ink)}
.tokline{min-height:62px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.tokline.right{border-style:solid;border-color:var(--good);background:var(--good-soft)}
.tokline.wrong{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.tokpool{display:flex;flex-wrap:wrap;gap:6px}
.tok{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-family:var(--f-display);font-size:1.15rem;min-height:44px;color:var(--ink)}
.tok.used{visibility:hidden}
.tokline .tok{background:var(--accent-soft);border-color:var(--accent)}
.swrite{width:100%;min-height:92px;font-family:var(--f-display);font-size:1.25rem;line-height:1.45;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);color:var(--ink);resize:vertical}
.swrite.right{border-color:var(--good)}
.swrite.wrong{border-color:var(--bad)}
.diff{margin:0;font-family:var(--f-display);font-size:1.15rem;line-height:1.6}
.diff del{color:var(--bad);text-decoration:line-through}
.diff ins{color:var(--good);text-decoration:none;font-weight:700;border-bottom:2px solid var(--good)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:.92rem;max-width:min(92vw,520px);z-index:20;box-shadow:var(--shadow)}
.note{font-size:.8rem;color:var(--muted);margin:0;text-align:center}
@media (max-width:560px){
  .opts{grid-template-columns:1fr}
  .row{grid-template-columns:36px minmax(0,1fr);padding:14px}
  .kbtn{grid-column:2;justify-self:start}
  .c-nav{grid-template-columns:1fr 1fr}
  .c-nav .navbtn{order:3}
  .tabs small{display:none}
  .tabs button{padding:8px 2px;font-size:.92rem}
  body{padding-block:12px 40px}
  .app{gap:12px}
  .eyebrow{display:none}
  h1{font-size:1.65rem}
  .card,.qbox{padding:18px 16px 16px}
  .c-back{min-height:120px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <p class="eyebrow">화명중 2학년 필수 어휘 · 2학기 1차고사 범위</p>
      <h1>Power English<span>101–150</span></h1>
    </div>
    <button class="chk" id="setbtn" data-act="set" aria-expanded="false" aria-controls="voicebar"><span class="dot"></span>소리 설정</button>
    <div class="voicebar" id="voicebar" hidden></div>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div class="filters" id="filters" aria-label="공부할 범위"></div>
  <main id="view"></main>
  <p class="note">발음은 미리 녹음한 원어민식 음성(여자·남자)으로 재생돼 iPad와 안드로이드 폰 모두에서 들려요. 소리가 안 나면 미디어 볼륨을 확인하세요. 속도·목소리는 위의 '소리 설정'에서 바꿔요.</p>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
"use strict";
/* ---------- data: Power English 11~15 (No.101~150) ---------- */
const UNITS={

  player.onerror=()=>{player.onerror=null;if(synth)speak(text,slow);else toast("발음 파일을 불러오지 못했어요. 인터넷 연결을 확인하세요.");};
  const p=player.play();
  if(p&&p.catch)p.catch(err=>{if(err&&err.name==="NotAllowedError")toast("화면을 한 번 누른 다음 다시 눌러 주세요.");});
}
function sayEntry(n,what,slow){
  const x=BY[n];if(!x)return;
  const text=what==="sent"?plain(x.s):x.w;
  if(S.engine==="device")speak(text,slow);else playFile(n,what,slow,text);
}

function inFilter(x,f){

}
const pool=()=>W.filter(x=>inFilter(x,S.filter));

function renderFilters(){

/* ---------- 퀴즈 ---------- */
const QT=[
  {id:"e2k",name:"영어 → 뜻",desc:"단어를 보고 뜻 고르기"},
  {id:"k2e",name:"뜻 → 영어",desc:"뜻을 보고 단어 고르기"},
  {id:"listen",name:"듣고 고르기",desc:"발음만 듣고 뜻 고르기"},
  {id:"spell",name:"철자 쓰기",desc:"발음과 뜻을 보고 단어 직접 쓰기"},
  {id:"blank",name:"예문 빈칸",desc:"예문 빈칸에 알맞은 형태 쓰기 (buried, Rub처럼)"}
];
let Q=null;
function startQuiz(items){
  if(!items.length){toast("이 범위에는 문제를 낼 단어가 없어요.");return;}
  Q={type:S.qtype,items,i:0,score:0,wrongs:[],done:false};
  prepQ();render();toView();afterQRender();
}
function prepQ(){
  const x=Q.items[Q.i];
  Q.ans=null;Q.typed="";Q.hint=false;
  if(["e2k","k2e","listen"].includes(Q.type)){
    const others=shuffle(W.filter(y=>y.n!==x.n&&y.m!==x.m)).slice(0,3);
    Q.choices=shuffle([x,...others]);
  }
}
function qTarget(x){return Q.type==="blank"?formOf(x):x.w;}
function viewQuiz(){
  if(!Q)return viewQuizSetup();
  if(Q.done)return viewQuizEnd();
  const x=Q.items[Q.i],N=Q.items.length,t=QT.find(q=>q.id===Q.type);
  let prompt="";
  if(Q.type==="e2k")prompt=`<div class="c-line"><p class="q-word">${esc(x.w)}</p>${sayBtn(x.n,"word","단어 발음 듣기")}</div><span class="ipa">[${esc(x.ipa)}]</span>`;
  if(Q.type==="k2e")prompt=`<p class="q-mean">${esc(x.m)}</p>`;
  if(Q.type==="listen")prompt=`<div class="q-listen"><button class="btn primary" data-say="word" data-n="${x.n}">${ICON_SPK}다시 듣기</button><button class="btn" data-say="word" data-slow="1" data-n="${x.n}">천천히</button></div>`;
  if(Q.type==="spell")prompt=`<p class="q-mean">${esc(x.m)}</p><div class="c-line"><button class="btn primary" data-say="word" data-n="${x.n}">${ICON_SPK}발음 듣기</button><button class="btn" data-say="word" data-slow="1" data-n="${x.n}">천천히</button>${Q.hint?`<span class="ipa">첫 글자: ${esc(x.w[0])} · ${x.w.length}글자</span>`:""}</div>`;
  if(Q.type==="blank"){
    const f=formOf(x);
    const shown=Q.ans?`<span class="q-blank">${esc(f)}</span>`:`<span class="q-blank">${Q.hint?esc(f[0])+" "+"_ ".repeat(f.length-1):"&nbsp;"}</span>`;
    prompt=`<p class="q-sent">${esc(x.s).replace(/\*\*(.+?)\*\*/,shown)}</p><p class="ko">${esc(x.k)}</p>`;
  }
  let answer="";
  if(Q.choices&&["e2k","k2e","listen"].includes(Q.type)){
    answer=`<div class="opts">`+Q.choices.map((c,i)=>{
      let cls="opt"+(Q.type==="k2e"?" en":"");
      if(Q.ans){if(c.n===x.n)cls+=" right";else if(Q.ans.pick===c.n)cls+=" wrong";}
      return `<button class="${cls}" data-act="choose" data-n="${c.n}" data-k="${i+1}"${Q.ans?" disabled":""}>${esc(Q.type==="k2e"?c.w:c.m)}</button>`;
    }).join("")+`</div>`;
  }else{
    const cls=Q.ans?(Q.ans.ok?"right":"wrong"):"";
    answer=`<form class="typeform" id="typeform" autocomplete="off"><input id="typed" class="${cls}" type="text" inputmode="latin" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="영어로 쓰기" value="${esc(Q.typed)}"${Q.ans?" readonly":""} aria-label="답 입력">${Q.ans?"":`<button class="btn primary" type="submit">확인</button>`}</form>`;
  }
  let fb="";
  if(Q.ans){
    const ok=Q.ans.ok;
    fb=`<div class="fb ${ok?"ok":"no"}"><p class="verdict">${ok?"정답이에요!":"틀렸어요. 정답을 확인하세요."}</p>
      ${!ok&&Q.ans.typed!==undefined?`<p class="yours">내 답: ${esc(Q.ans.typed||"(빈칸)")}</p>`:""}
      <div class="ansline"><strong>${esc(qTarget(x))}</strong>${sayBtn(x.n,"word","단어 발음 듣기")}<span class="ipa">[${esc(x.ipa)}]</span><span>${esc(x.m)}</span></div>
      <div class="c-sent"><p class="q-sent" style="font-size:1.1rem">${marked(x.s)}</p>${sayBtn(x.n,"sent","예문 듣기")}</div>
      ${x.t?`<p class="tip">${esc(x.t)}</p>`:""}</div>`;
  }
  let acts="";
  if(!Q.ans){
    if(Q.type==="spell"||Q.type==="blank")acts=`${Q.hint?"":`<button class="btn" data-act="hint">힌트</button>`}<button class="btn" data-act="giveup">모르겠어요</button>`;
  }else acts=`<button class="btn primary" data-act="qnext" id="qnext">${Q.i+1<N?"다음 문제 ▶":"결과 보기"}</button>`;
  return `<div class="qhead"><span class="num">${Q.i+1} / ${N}</span><div class="bar"><i style="width:${Math.round(Q.i/N*100)}%"></i></div><span class="num">맞힘 ${Q.score}</span><button class="xbtn" data-act="qquit">그만하기</button></div>
  <section class="panel qbox">
    <p class="qkind">${t.name}${x.st?' · <span class="badge">★ 시험</span>':""}</p>
    <div class="qprompt">${prompt}</div>
    ${answer}${fb}
  </section>
  ${acts?`<div class="dock">${acts}</div>`:""}
  ${["e2k","k2e","listen"].includes(Q.type)&&!Q.ans?'<p class="note">키보드에서는 1~4 숫자로 고를 수 있어요.</p>':""}`;
}
function viewQuizSetup(){
  const p=pool();
  const counts=[[10,"10문제"],[20,"20문제"],[0,"전부"]];
  return `<section class="panel qsetup">
    <h2>퀴즈</h2>
    <div><p class="label">문제 유형</p><div class="qtypes">${QT.map(q=>`<button class="qtype" data-act="qtype" data-v="${q.id}" aria-pressed="${S.qtype===q.id}"><b>${q.name}</b><span>${q.desc}</span></button>`).join("")}</div></div>
    <div><p class="label">문제 수</p><div class="seg" role="group" aria-label="문제 수">${counts.map(([c,l])=>`<button data-act="qcount" data-v="${c}" aria-pressed="${S.qcount===c}">${l}</button>`).join("")}</div></div>
    <p class="ko">범위: <b>${esc(curFilterName())}</b> (${p.length}단어) · 범위는 위쪽 '범위' 버튼으로 바꿀 수 있어요.</p>
    <div><button class="btn primary" data-act="qstart" style="min-width:180px">시작하기</button></div>
  </section>`;
}
function viewQuizEnd(){
  const N=Q.items.length,pct=Math.round(Q.score/N*100);
  const msg=pct===100?"완벽해요! 다른 유형으로도 확인해 보세요.":pct>=80?"잘했어요. 틀린 단어만 한 번 더 보면 돼요.":pct>=50?"절반 넘게 맞혔어요. 틀린 단어를 카드로 다시 외워 보세요.":"단어장과 카드로 먼저 외운 다음 다시 풀어 보세요.";
  const uniq=[...new Set(Q.wrongs)];
  return `<section class="panel qend">
    <p class="score">${Q.score}<small>/ ${N} 맞힘 · ${pct}점</small></p>
    <p class="ko">${msg}</p>
    ${uniq.length?`<div class="mini"><p class="label" style="margin:0 0 6px;font-size:.82rem;color:var(--muted)">틀린 단어 ${uniq.length}개</p>${uniq.map(n=>{const x=BY[n];return `<div class="mini-row"><span class="w">${esc(Q.type==="blank"?formOf(x):x.w)}</span><span class="m">${esc(x.m)}</span>${sayBtn(n,"word","발음 듣기")}</div>`;}).join("")}</div>`:""}
    <div class="btnrow">${uniq.length?`<button class="btn primary" data-act="qretry">틀린 것만 다시 풀기</button>`:""}<button class="btn" data-act="qagain">새로 풀기</button><button class="btn" data-act="qquit">유형 바꾸기</button></div>
  </section>`;
}
function answer(ok,extra){
  const x=Q.items[Q.i];
  Q.ans=Object.assign({ok},extra||{});
  if(ok)Q.score++;else{Q.wrongs.push(x.n);addWrong(x.n);}
  render();
  if(S.auto)sayEntry(x.n,"word");
  const nb=$("#qnext");if(nb)nb.focus({preventScroll:true});
}
function afterQRender(){
  if(!Q||Q.done)return;
  const x=Q.items[Q.i];
  if(Q.type==="listen"||(Q.type==="spell")||(S.auto&&Q.type==="e2k"))sayEntry(x.n,"word");
  const inp=$("#typed");if(inp&&!Q.ans)inp.focus({preventScroll:true});
}
function qNext(){
  if(Q.i+1>=Q.items.length){Q.done=true;render();toView();return;}
  Q.i++;prepQ();render();toView();afterQRender();
}

/* ---------- 문장 (예문 통째로 외우기) ---------- */
/* 범위: 시험 문장 20(선생님 프린트 '문장 포함' ★) 이 기본. 단어 탭 범위와 따로 움직인다 */
const SSCOPE=[["star","★ 시험 문장"],["all","전체"],["todo","못 외운 것"],["wrong","틀린 것"]];
function inSScope(x,f){
  if(f==="star")return !!x.st;
  if(f==="todo")return x.st?!sknown.has(x.n):false;   /* 시험 문장 중 아직 못 외운 것 */
  if(f==="wrong")return !!S.swrong[x.n];
  return true;
}
const spool=()=>W.filter(x=>inSScope(x,S.sscope));
const SMODES=[["card","문장 카드"],["order","단어 배열"],["write","영작"]];
let sOrder=[],si=0,sRev=false,sToks=null,sPicked=[],sTyped="",sRes=null,sHint=false,sScore=0,sTried=0;
function sReset(){sRev=false;sToks=null;sPicked=[];sTyped="";sRes=null;sHint=false;}
function sSync(){
  const ids=spool().map(x=>x.n);
  const same=ids.length===sOrder.length&&ids.every(n=>sOrder.includes(n));
  if(!same){sOrder=ids;si=0;sReset();}
  if(si>=sOrder.length)si=0;
}
const sWords=x=>plain(x.s).split(" ");
const normS=s=>String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9' ]+/g," ").replace(/\s+/g," ").trim();
function wdiff(user,right){
  /* 단어 단위 LCS: 내 답에만 있는 말은 <del>, 빠진 말은 <ins> */
  const a=normS(user).split(" ").filter(Boolean),bw=right.split(" "),b=bw.map(normS);
  const m=a.length,n=b.length,L=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const out=[];let i=0,j=0;
  while(i<m&&j<n){
    if(a[i]===b[j]){out.push(esc(bw[j]));i++;j++;}
    else if(L[i+1][j]>=L[i][j+1]){out.push(`<del>${esc(a[i])}</del>`);i++;}
    else{out.push(`<ins>${esc(bw[j])}</ins>`);j++;}
  }
  while(i<m)out.push(`<del>${esc(a[i++])}</del>`);
  while(j<n)out.push(`<ins>${esc(bw[j++])}</ins>`);
  return out.join(" ");
}
function sFeedback(x,ok,extra){
  return `<div class="fb ${ok?"ok":"no"}"><p class="verdict">${ok?"정답이에요!":"정답 문장을 확인하세요."}</p>
    ${extra||""}
    <div class="c-sent"><p class="s-en">${marked(x.s)}</p>${sayBtn(x.n,"sent","문장 듣기")}</div>
    <p class="ko">${esc(x.k)}</p>${x.t?`<p class="tip">${esc(x.t)}</p>`:""}</div>`;
}
function viewSent(){
  sSync();
  const scope=`<div class="filters" role="group" aria-label="문장 범위">`+SSCOPE.map(([id,l])=>{
      const c=W.filter(x=>inSScope(x,id)).length;
      return `<button class="chip${id==="star"?" starchip":""}" data-act="sscope" data-v="${id}" aria-pressed="${S.sscope===id}">${l}<b>${c}</b></button>`;
    }).join("")+`</div>`;
  const modes=`<div class="seg" role="group" aria-label="공부 방법">`+SMODES.map(([id,l])=>`<button data-act="smode" data-v="${id}" aria-pressed="${S.smode===id}">${l}</button>`).join("")+`</div>`;
  if(!sOrder.length){
    const msg=S.sscope==="todo"?"시험 문장 20개를 모두 외웠어요. '영작'으로 통째로 써 보세요.":S.sscope==="wrong"?"아직 틀린 문장이 없어요. '단어 배열'이나 '영작'에서 틀리면 여기에 모여요.":"이 범위에 문장이 없어요.";
    return scope+modes+`<div class="panel empty">${msg}</div>`;
  }
  const x=BY[sOrder[si]],len=sOrder.length;
  const kn=sOrder.filter(n=>sknown.has(n)).length;
  const meta=S.smode==="card"
    ?`<div class="cardmeta"><span class="num">${si+1} / ${len}</span><div class="bar"><i style="width:${Math.round(kn/len*100)}%"></i></div><span>외운 문장 <span class="num">${kn}/${len}</span></span></div>`
    :`<div class="cardmeta"><span class="num">${si+1} / ${len}</span><div class="bar"><i style="width:${Math.round((si+(sRes?1:0))/len*100)}%"></i></div><span>맞힘 <span class="num">${sScore}/${sTried}</span></span></div>`;
  const top=`<div class="c-top"><span class="c-no">No. ${x.n}</span>${x.st?'<span class="badge">★ 시험</span>':""}${sknown.has(x.n)?'<span style="color:var(--good)">✓ 외움</span>':""}</div>`;
  const key=`<p class="s-key">핵심 단어 <b>${esc(x.w)}</b> · ${esc(x.m)}</p>`;
  let body="",dock="";
  if(S.smode==="card"){
    const k2e=S.sdir==="k2e";
    const front=k2e?`<p class="s-ko">${esc(x.k)}</p>${key}`
      :`<div class="c-sent"><p class="s-en">${esc(plain(x.s))}</p>${sayBtn(x.n,"sent","문장 듣기")}</div>`;
    const back=!sRev?`<p class="c-hint">탭해서 ${k2e?"영어 문장":"우리말 뜻"} 보기</p>`
      :(k2e?`<div class="c-sent"><p class="s-en">${marked(x.s)}</p>${sayBtn(x.n,"sent","문장 듣기")}</div>
          <div class="c-say"><button class="btn" data-say="sent" data-slow="1" data-n="${x.n}">${ICON_SPK}천천히</button></div>`
          :`<p class="s-ko">${esc(x.k)}</p>${key}`)
        +(x.t?`<p class="tip">${esc(x.t)}</p>`:"");
    body=`<article class="panel card${x.st?" isstar":""}" id="card">${top}${front}<div class="c-back${sRev?" open":""}" data-act="sreveal">${back}</div></article>
      <div class="c-tools"><div class="seg" role="group" aria-label="카드 방향"><button data-act="sdir" data-v="k2e" aria-pressed="${k2e}">우리말 → 영어</button><button data-act="sdir" data-v="e2k" aria-pressed="${!k2e}">영어 → 우리말</button></div>
      <button class="btn" data-act="sshuf">섞기</button><button class="btn" data-act="snum">번호순</button></div>`;
    dock=`<button class="btn icon" data-act="sprev" aria-label="이전 문장">◀</button><button class="btn bad" data-act="smark" data-v="0">몰라요</button><button class="btn good" data-act="smark" data-v="1">외웠어요</button><button class="btn icon" data-act="snext" aria-label="다음 문장">▶</button>`;
  }else if(S.smode==="order"){
    const words=sWords(x);
    if(!sToks){
      let t=words.map((w,i)=>({w,i}));
      for(let k=0;k<5;k++){t=shuffle(t);if(words.length<2||t.some((o,i)=>o.i!==i))break;}
      sToks=t;
    }
    const lineCls=sRes?(sRes.ok?" right":" wrong"):"";
    const line=sPicked.map((k,pos)=>`<button class="tok" data-act="sunpick" data-p="${pos}"${sRes?" disabled":""}>${esc(sToks[k].w)}</button>`).join("");
    const poolH=sToks.map((o,k)=>`<button class="tok${sPicked.includes(k)?" used":""}" data-act="spick" data-k="${k}"${sRes||sPicked.includes(k)?" disabled":""}>${esc(o.w)}</button>`).join("");
    body=`<section class="panel qbox">${top}<p class="qkind">단어를 눌러 순서대로 · 놓은 단어를 누르면 빠져요</p><p class="s-ko">${esc(x.k)}</p>
      <div class="tokline${lineCls}" aria-label="내가 만든 문장">${line||'<span class="c-hint" style="margin:auto">여기에 문장이 만들어져요</span>'}</div>
      ${sRes?sFeedback(x,sRes.ok):`<div class="tokpool">${poolH}</div>`}</section>`;
    dock=sRes?`<button class="btn primary" data-act="snext">${si+1<len?"다음 문장 ▶":"처음부터 다시"}</button>`
      :`<button class="btn" data-act="sclear">처음부터</button><button class="btn" data-act="sgive">정답 보기</button>`;
  }else{
    const cls=sRes?(sRes.ok?" right":" wrong"):"";
    const hint=sHint?`<p class="s-key">힌트: <b>${esc(sWords(x).slice(0,3).join(" "))} …</b> (${sWords(x).length}단어)</p>`:"";
    body=`<section class="panel qbox">${top}<p class="qkind">우리말을 보고 영어 문장 전체를 쓰세요 · 핵심 단어를 꼭 넣기</p><p class="s-ko">${esc(x.k)}</p>
      <p class="s-key">( <b>${esc(x.w)}</b> )</p>${hint}
      <form id="swform" autocomplete="off"><textarea id="swrite" class="swrite${cls}" rows="3" autocapitalize="sentences" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="영어 문장을 쓰세요" aria-label="영작 답"${sRes?" readonly":""}>${esc(sTyped)}</textarea></form>
      ${sRes?sFeedback(x,sRes.ok,sRes.ok?"":`<p class="yours">고칠 곳 — 빨간 줄은 빼고, 초록 밑줄은 넣어야 해요</p><p class="diff">${sRes.typed.trim()?wdiff(sRes.typed,plain(x.s)):"(빈칸)"}</p>`):""}</section>`;
    dock=sRes?`<button class="btn primary" data-act="snext">${si+1<len?"다음 문장 ▶":"처음부터 다시"}</button>`
      :`${sHint?"":`<button class="btn" data-act="shint">힌트</button>`}<button class="btn" data-act="sgive">모르겠어요</button><button class="btn primary" data-act="scheck">확인</button>`;
  }
  return scope+modes+meta+body+`<div class="dock">${dock}</div>`
    +(S.sscope==="star"?`<p class="note">★ 시험 문장 = 선생님 프린트 'Power English 101-150 (2학기 1차고사)'의 "문장 포함" 20단어. 시험에서는 빈칸·영작으로 나와요.</p>`:"");
}
function sCheckOrder(){
  const x=BY[sOrder[si]];
  if(sPicked.length<sWords(x).length)return;
  const built=sPicked.map(k=>sToks[k].w).join(" ");
  sRes={ok:built===plain(x.s)};sTried++;
  if(sRes.ok)sScore++;else addSWrong(x.n);
  render();if(S.auto)sayEntry(x.n,"sent");
}
function sCheckWrite(){
  const x=BY[sOrder[si]],el=$("#swrite");
  sTyped=el?el.value:sTyped;
  if(!sTyped.trim()){toast("문장을 쓰거나 '모르겠어요'를 누르세요.");return;}
  sRes={ok:normS(sTyped)===normS(plain(x.s)),typed:sTyped};sTried++;
  if(sRes.ok)sScore++;else addSWrong(x.n);
  render();if(S.auto)sayEntry(x.n,"sent");
}
function sMove(d){
  if(!sOrder.length)return;
  si=(si+d+sOrder.length)%sOrder.length;sReset();render();toView();
  if(S.auto&&S.smode==="card"&&S.sdir==="e2k")sayEntry(sOrder[si],"sent");
}
/* 다음 문제·카드로 넘어갈 때 문제 칸이 화면 위에 오게 한다 (위로 많이 내려가 있을 때만) */
function toView(){
  const v=$("#view"),tabs=$("#tabs");
  const y=v.getBoundingClientRect().top+window.scrollY-tabs.getBoundingClientRect().height-12;
  if(window.scrollY>y+2)window.scrollTo({top:Math.max(0,y)});
}

/* ---------- 오답노트 ---------- */
let confirmReset=null;
function viewWrong(){
  const ids=Object.keys(S.wrong).map(Number).sort((a,b)=>S.wrong[b]-S.wrong[a]||a-b);
  let h=`<section class="panel wrongs"><h2>오답노트</h2>`;
  if(!ids.length)h+=`<p>아직 틀린 단어가 없어요. 퀴즈에서 틀린 단어는 여기에 자동으로 모이고, 많이 틀린 순서로 정렬돼요.</p>`;
  else{
    h+=`<p>퀴즈에서 틀린 단어 ${ids.length}개. 다 외운 단어는 '지우기'로 빼세요.</p>
    <div class="btnrow"><button class="btn primary" data-act="wcard">오답만 카드로 외우기</button><button class="btn" data-act="wquiz">오답만 퀴즈</button></div>
    <div class="mini">${ids.map(n=>{const x=BY[n];return `<div class="mini-row"><span class="w">${esc(x.w)} ${sayBtn(n,"word","발음 듣기")}</span><span class="m">${esc(x.m)} <span class="cnt">×${S.wrong[n]}</span></span><button class="xbtn" data-act="wdel" data-n="${n}">지우기</button></div>`;}).join("")}</div>`;
  }
  h+=`</section>`;
  const sids=Object.keys(S.swrong).map(Number).sort((a,b)=>S.swrong[b]-S.swrong[a]||a-b);
  h+=`<section class="panel wrongs"><h2>틀린 문장</h2>`;
  if(!sids.length)h+=`<p>문장 탭의 '단어 배열'·'영작'에서 틀린 문장이 여기에 모여요.</p>`;
  else h+=`<p>틀린 문장 ${sids.length}개. 다 외운 문장은 '지우기'로 빼세요.</p>
    <div class="btnrow"><button class="btn primary" data-act="wsent">틀린 문장만 연습</button></div>
    <div class="mini">${sids.map(n=>{const x=BY[n];return `<div class="mini-row"><span class="w" style="font-size:1rem">${sayBtn(n,"sent","문장 듣기")}</span><span class="m"><span style="color:var(--ink)">${marked(x.s)}</span><br>${esc(x.k)} <span class="cnt">×${S.swrong[n]}</span></span><button class="xbtn" data-act="swdel" data-n="${n}">지우기</button></div>`;}).join("")}</div>`;
  h+=`</section>
  <section class="panel wrongs"><h2>학습 기록</h2>
    <p>외운 단어 ${known.size} / 50 · 외운 시험 문장 ${W.filter(x=>x.st&&sknown.has(x.n)).length} / 20 · 기록은 이 기기의 이 브라우저에만 저장돼요.</p>
    <div class="btnrow">
      <button class="btn${confirmReset==="wrong"?" bad":""}" data-act="reset" data-v="wrong">${confirmReset==="wrong"?"한 번 더 누르면 오답 기록 삭제":"오답 기록 모두 지우기"}</button>
      <button class="btn${confirmReset==="known"?" bad":""}" data-act="reset" data-v="known">${confirmReset==="known"?"한 번 더 누르면 외움 표시 삭제":"외움 표시 모두 지우기"}</button>
      <button class="btn${confirmReset==="sent"?" bad":""}" data-act="reset" data-v="sent">${confirmReset==="sent"?"한 번 더 누르면 문장 기록 삭제":"문장 기록 모두 지우기"}</button>
    </div>
  </section>`;
  return h;
}

/* ---------- render ---------- */
function render(){
  renderTabs();renderFilters();
  const v=$("#view");
  v.style.display="flex";v.style.flexDirection="column";v.style.gap="14px";
  v.innerHTML=S.tab==="list"?viewList():S.tab==="card"?viewCard():S.tab==="sent"?viewSent():S.tab==="quiz"?viewQuiz():viewWrong();
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const sb=e.target.closest("[data-say]");
  if(sb){sayEntry(+sb.dataset.n,sb.dataset.say,!!sb.dataset.slow);return;}
  const b=e.target.closest("[data-act]");
  if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;
  switch(a){
    case "tab":S.tab=v;confirmReset=null;fopen=false;save();render();window.scrollTo({top:0});if(v==="card")cardSpeakFront();break;
    case "filter":S.filter=v;fopen=false;save();render();break;
    case "fopen":fopen=!fopen;renderFilters();break;
    case "set":S.showSet=!S.showSet;save();renderVoicebar();break;
    /* 문장 탭 */
    case "sscope":S.sscope=v;sOrder=[];sScore=0;sTried=0;save();render();break;
    case "smode":S.smode=v;sReset();sScore=0;sTried=0;save();render();break;
    case "sdir":S.sdir=v;sRev=false;save();render();if(S.auto&&v==="e2k")sayEntry(sOrder[si],"sent");break;
    case "sreveal":if(!sRev){sRev=true;render();if(S.auto&&S.sdir==="k2e")sayEntry(sOrder[si],"sent");}break;
    case "sprev":sMove(-1);break;
    case "snext":sMove(1);break;
    case "smark":{
      const n=sOrder[si];setSKnown(n,v==="1");
      if(S.sscope==="todo"&&v==="1"){sSync();sReset();render();toView();}
      else sMove(1);
      break;}
    case "sshuf":sOrder=shuffle(sOrder);si=0;sReset();render();toast("문장을 섞었어요.");break;
    case "snum":sOrder=sOrder.slice().sort((a,b)=>a-b);si=0;sReset();render();break;
    case "spick":{
      const k=+b.dataset.k;if(sRes||sPicked.includes(k))break;
      sPicked.push(k);
      if(sPicked.length===sWords(BY[sOrder[si]]).length)sCheckOrder();else render();
      break;}
    case "sunpick":if(!sRes){sPicked.splice(+b.dataset.p,1);render();}break;
    case "sclear":sPicked=[];render();break;
    case "shint":{const el=$("#swrite");if(el)sTyped=el.value;sHint=true;render();const t=$("#swrite");if(t)t.focus({preventScroll:true});break;}
    case "scheck":sCheckWrite();break;
    case "sgive":{
      const x=BY[sOrder[si]],el=$("#swrite");
      if(el)sTyped=el.value;
      sRes={ok:false,typed:sTyped};sTried++;addSWrong(x.n);render();if(S.auto)sayEntry(x.n,"sent");
      break;}
    case "wsent":S.tab="sent";S.sscope="wrong";if(S.smode==="card")S.smode="order";sOrder=[];sScore=0;sTried=0;save();render();window.scrollTo({top:0});break;
    case "swdel":delete S.swrong[+b.dataset.n];save();render();break;
    case "rate":S.rate=+v;save();renderVoicebar();sayEntry(101,"word");break;
    case "engine":S.engine=v;save();renderVoicebar();sayEntry(101,"word");break;
    case "auto":S.auto=!S.auto;save();renderVoicebar();break;
    case "hide":S.hide=!S.hide;save();render();break;
    case "peek":{const r=b.closest(".row");if(r&&r.classList.contains("cover"))r.classList.remove("cover");break;}
    case "known":{const n=+b.dataset.n;setKnown(n,!known.has(n));b.setAttribute("aria-pressed",known.has(n));b.textContent=known.has(n)?"✓ 외움":"외움 표시";renderFilters();break;}
    case "reveal":if(!revealed){revealed=true;render();if(S.auto&&S.cardMode==="ko")sayEntry(cardOrder[ci],"word");}break;
    case "prev":moveCard(-1);break;
    case "next":moveCard(1);break;
    case "mark":{
      const n=cardOrder[ci];setKnown(n,v==="1");
      if(S.filter==="todo"&&v==="1"){syncOrder();revealed=false;render();cardSpeakFront();}
      else moveCard(1);
      break;}
    case "cmode":S.cardMode=v;revealed=false;save();render();break;
    case "shuffle":cardOrder=shuffle(cardOrder);ci=0;revealed=false;render();cardSpeakFront();toast("카드를 섞었어요.");break;
    case "order":cardOrder=cardOrder.slice().sort((a,b)=>a-b);ci=0;revealed=false;render();cardSpeakFront();break;
    case "qtype":S.qtype=v;save();render();break;
    case "qcount":S.qcount=+v;save();render();break;
    case "qstart":{const p=shuffle(pool());startQuiz(S.qcount?p.slice(0,S.qcount):p);break;}
    case "qagain":{const p=shuffle(pool());startQuiz(S.qcount?p.slice(0,S.qcount):p);break;}
    case "qretry":startQuiz(shuffle([...new Set(Q.wrongs)].map(n=>BY[n])));break;
    case "qquit":Q=null;render();break;
    case "choose":if(!Q.ans){const n=+b.dataset.n;answer(n===Q.items[Q.i].n,{pick:n});}break;
    case "hint":Q.hint=true;Q.typed=($("#typed")||{}).value||"";render();{const i=$("#typed");if(i)i.focus({preventScroll:true});}break;
    case "giveup":answer(false,{typed:($("#typed")||{}).value||""});break;
    case "qnext":qNext();break;
    case "wcard":S.filter="wrong";S.tab="card";cardOrder=[];save();render();cardSpeakFront();break;
    case "wquiz":S.filter="wrong";S.tab="quiz";Q=null;save();render();break;
    case "wdel":delete S.wrong[+b.dataset.n];save();render();break;
    case "reset":
      if(confirmReset!==v){confirmReset=v;render();break;}
      if(v==="wrong")S.wrong={};
      else if(v==="sent"){S.swrong={};sknown=new Set();S.sknown=[];}
      else{known=new Set();S.known=[];}
      confirmReset=null;save();render();toast(v==="wrong"?"오답 기록을 지웠어요.":v==="sent"?"문장 기록을 지웠어요.":"외움 표시를 지웠어요.");break;
  }
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="typeform")return;
  e.preventDefault();
  if(!Q)return;
  if(Q.ans){qNext();return;}
  const val=$("#typed").value;
  if(!val.trim()){toast("답을 입력하거나 '모르겠어요'를 누르세요.");return;}
  Q.typed=val;
  answer(norm(val)===norm(qTarget(Q.items[Q.i])),{typed:val});
});
document.addEventListener("change",e=>{
  if(e.target.id==="voiceSelect"){S.voice=e.target.value;save();speak("Hello. This is Power English.");}
});
document.addEventListener("keydown",e=>{
  /* 영작 칸: Enter = 확인 / 다음 (줄바꿈 대신) */
  if(e.target.id==="swrite"&&e.key==="Enter"&&!e.shiftKey&&!e.isComposing){
    e.preventDefault();if(sRes)sMove(1);else sCheckWrite();return;
  }
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT"||e.target.tagName==="TEXTAREA"||e.metaKey||e.ctrlKey)return;
  if(S.tab==="sent"){
    if(e.key==="ArrowRight"){sMove(1);e.preventDefault();}
    else if(e.key==="ArrowLeft"){sMove(-1);e.preventDefault();}
    else if(e.key===" "&&S.smode==="card"&&!sRev){sRev=true;render();e.preventDefault();}
    else if(e.key==="Enter"&&sRes){sMove(1);e.preventDefault();}
    return;
  }
  if(S.tab==="card"){
    if(e.key==="ArrowRight"){moveCard(1);e.preventDefault();}
    else if(e.key==="ArrowLeft"){moveCard(-1);e.preventDefault();}
    else if(e.key===" "&&!revealed){revealed=true;render();e.preventDefault();}
  }else if(S.tab==="quiz"&&Q&&!Q.done){
    if(!Q.ans&&/^[1-4]$/.test(e.key)&&Q.choices&&["e2k","k2e","listen"].includes(Q.type)){
      const c=Q.choices[+e.key-1];if(c)answer(c.n===Q.items[Q.i].n,{pick:c.n});
    }else if(Q.ans&&e.key==="Enter"&&document.activeElement?.id!=="qnext"){qNext();e.preventDefault();}
  }
});
let tx=null,ty=null;
document.addEventListener("touchstart",e=>{if((S.tab!=="card"&&S.tab!=="sent")||!e.target.closest("#card"))return;tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.addEventListener("touchend",e=>{
  if(tx===null)return;
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){if(S.tab==="sent")sMove(dx<0?1:-1);else moveCard(dx<0?1:-1);}
},{passive:true});

if(!TABS.some(t=>t[0]===S.tab))S.tab="list";
renderVoicebar();render();
})();
</script>
</body>
</html>
